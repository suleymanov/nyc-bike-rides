stages:
  - build
  - use

build_image:
  stage: build
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

use_image:
  stage: use
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker run -d --name model -p 8001:8000 "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - sleep 10
    - test_container=$(docker create --network host -e SERVICE_URL=http://127.0.0.1:8001/predict python:3.12-slim sh -c "pip install requests && python /test_predict.py")
    - docker cp test_predict.py $test_container:/test_predict.py
    - docker start -a $test_container
    - docker rm $test_container
