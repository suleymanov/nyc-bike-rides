stages:
  - test

model_smoke_test:
  stage: test
  tags:
    - docker

  variables:
    DOCKER_HOST: "tcp://dind:2375"

  script:
    - echo "DOCKER_HOST=$DOCKER_HOST"
    - docker build -t nyc-bike-model:$CI_COMMIT_SHORT_SHA .
    - docker run -d --name model -p 8001:8000 nyc-bike-model:$CI_COMMIT_SHORT_SHA
    - sleep 10
    - test_container=$(docker create --network host -e SERVICE_URL=http://127.0.0.1:8001/predict python:3.12-slim sh -c "pip install requests && python /test_predict.py")
    - docker cp test_predict.py $test_container:/test_predict.py
    - docker start -a $test_container
    - docker rm $test_container

  after_script:
    - docker logs model || true
    - docker stop model || true
    - docker rm model || true
